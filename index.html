<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fylkene</title>

<style>
:root {
  --bg-1: #07131f;
  --bg-2: #0d1d2d;
  --panel: rgba(13, 20, 27, 0.97);
  --panel-border: rgba(255,255,255,0.12);
  --text: #edf6ff;
  --muted: #aac2d8;
  --primary: #71d6ff;
  --primary-2: #4597ff;
  --success: #2ee59d;
  --success-dark: #0a8d5b;
  --shadow: rgba(4, 10, 18, 0.7);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top, rgba(76, 180, 255, 0.18), transparent 28%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));
  color: var(--text);
  font-family: Arial, sans-serif;
}

main {
  max-width: 920px;
  margin: 0 auto;
  padding: 18px 18px 24px;
}

h1 {
  margin: 0 0 10px 0;
  font-size: 26px;
  letter-spacing: 0.04em;
}

.map-container {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--panel-border);
  background: rgba(10, 17, 24, 0.9);
  box-shadow: 0 18px 36px var(--shadow);
}

.map-controls {
  position: absolute;
  top: 12px;
  left: 16px;
  right: 16px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

#timer {
  width: fit-content;
  padding: 8px 16px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(113,214,255,0.24), rgba(69,151,255,0.18));
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.06em;
  box-shadow: 0 10px 22px rgba(28, 107, 158, 0.25);
}

#foundMessage {
  width: fit-content;
  margin: 0;
  padding: 7px 12px;
  background: linear-gradient(135deg, var(--success), var(--success-dark));
  color: white;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  display: none;
  box-shadow: 0 10px 20px rgba(20, 117, 74, 0.3);
}

#map {
  width: 100%;
  display: block;
  margin: 0;
  background: linear-gradient(180deg, rgba(17, 25, 33, 0.95), rgba(11, 19, 27, 0.9));
}

.county {
  fill: #2d4051;
  stroke: rgba(255,255,255,0.85);
  stroke-width: 1;
  transition: fill 0.2s ease, transform 0.2s ease;
}

.county.found {
  fill: #2ec27d;
  filter: drop-shadow(0 0 10px rgba(46, 194, 125, 0.6));
}

.controls {
  display: flex;
  gap: 10px;
  margin: 14px 0 0 0;
}

input {
  flex: 1;
  padding: 14px 16px;
  font-size: 18px;
  background: rgba(14, 22, 28, 0.85);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 12px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
}

input:focus {
  outline: 2px solid rgba(113, 214, 255, 0.45);
  border-color: rgba(113, 214, 255, 0.7);
}

button {
  padding: 14px 18px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #061418;
  font-weight: 800;
  box-shadow: 0 12px 20px rgba(69, 151, 255, 0.25);
  cursor: pointer;
}

button:hover {
  filter: brightness(1.06);
}

#status {
  margin: 10px 0 0 0;
  color: var(--muted);
  font-size: 14px;
  min-height: 20px;
}

#score {
  margin: 12px 0 0 0;
  display: block;
  font-size: 16px;
  color: var(--text);
}

#restart {
  margin: 12px 0 0 0;
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: none;
}

#menu {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(4, 9, 14, 0.98);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  overflow: hidden;
}

#menu.hidden {
  display: none;
}

.menu-panel {
  width: min(560px, calc(100vw - 30px));
  padding: 26px 20px 20px;
  border-radius: 26px;
  background: linear-gradient(180deg, rgba(10,17,24,0.98), rgba(15,22,29,0.98));
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 26px 55px rgba(0, 0, 0, 0.5);
}

.menu-title {
  margin: 0 0 18px 0;
  text-align: center;
  font-size: 28px;
  letter-spacing: 0.04em;
}

.section-title {
  margin: 18px 0 8px;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.mode-list,
.difficulty-list {
  display: grid;
  gap: 12px;
}

.mode-btn,
.difficulty-btn,
#start-game,
#menu-back {
  width: 100%;
  text-align: left;
  border-radius: 16px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: none;
  font-size: 18px;
  font-weight: 700;
  padding: 18px 16px;
}

.mode-btn.active,
.difficulty-btn.active {
  background: linear-gradient(135deg, rgba(113,214,255,0.18), rgba(69,151,255,0.18));
  border-color: rgba(113,214,255,0.55);
  box-shadow: 0 12px 24px rgba(69, 151, 255, 0.15);
}

.mode-btn.coming-soon {
  opacity: 0.65;
  cursor: not-allowed;
}

.mode-btn .small,
.difficulty-btn .small {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 4px;
}

#start-game {
  margin-top: 18px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #061418;
  text-align: center;
  border: 0;
  box-shadow: 0 12px 24px rgba(69, 151, 255, 0.2);
}

#menu-back {
  margin-top: 12px;
  text-align: center;
  background: rgba(255,255,255,0.02);
  border-color: rgba(255,255,255,0.1);
}

#menu-note {
  margin-top: 18px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

@media (min-width: 700px) {
  #map {
    height: 900px;
    object-fit: contain;
    object-position: center top;
  }
}

@media (max-width: 699px) {
  main {
    padding: 12px 12px 20px;
  }

  #map {
    height: auto;
    width: 100%;
  }

  .controls {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div id="menu">
  <div class="menu-panel">
    <h2 class="menu-title">Velg spillmodus</h2>

    <div class="mode-list">
      <button type="button" class="mode-btn active" data-mode="fylker">
        Fylker
        <span class="small">Nåværende spill</span>
      </button>

      <button type="button" class="mode-btn coming-soon" data-mode="kommuner">
        Alle kommuner
        <span class="small">Kommer snart</span>
      </button>

      <button type="button" class="mode-btn coming-soon" data-mode="kommuner-fylke">
        Kommuner i et fylke
        <span class="small">Kommer snart</span>
      </button>
    </div>

    <div class="section-title">Vanskelighetsgrad</div>

    <div class="difficulty-list">
      <button type="button" class="difficulty-btn" data-difficulty="lett">
        Lett
        <span class="small">3 minutter</span>
      </button>

      <button type="button" class="difficulty-btn active" data-difficulty="normal">
        Normal
        <span class="small">2 minutter</span>
      </button>

      <button type="button" class="difficulty-btn" data-difficulty="hard">
        Hard
        <span class="small">1 minutt</span>
      </button>
    </div>

    <button id="start-game" type="button">Start</button>

    <div id="menu-note">For nå er bare Fylker-spillet tilgjengelig.</div>
  </div>
</div>

<main>

<h1>🇳🇴 Fylkene</h1>

<div class="map-container">

  <div class="map-controls">
    <div id="timer">02:00</div>
    <div id="foundMessage"></div>
  </div>

  <svg id="map" viewBox="0 0 700 1050"></svg>

</div>

<form id="form" class="controls">
  <input id="answer" placeholder="Skriv et fylke..." autocomplete="off">
  <button type="submit">OK</button>
</form>

<div id="status">
Skriv inn fylkene så raskt du kan.
</div>

<p id="score">
  <b>0</b> / 15 fylker
</p>

<button id="restart" type="button">Start på nytt</button>
<button id="menu-back" type="button">Tilbake til meny</button>

</main>

<script>
const COUNTIES = [
  "Agder",
  "Akershus",
  "Buskerud",
  "Finnmark",
  "Innlandet",
  "Møre og Romsdal",
  "Nordland",
  "Oslo",
  "Rogaland",
  "Telemark",
  "Troms",
  "Trøndelag",
  "Vestfold",
  "Vestland",
  "Østfold"
];

const DIFFICULTY_SETTINGS = {
  lett: { seconds: 180, label: "Lett" },
  normal: { seconds: 120, label: "Normal" },
  hard: { seconds: 60, label: "Hard" }
};

const svg = document.getElementById("map");
const input = document.getElementById("answer");
const score = document.getElementById("score");
const timer = document.getElementById("timer");
const status = document.getElementById("status");
const foundMessage = document.getElementById("foundMessage");
const menu = document.getElementById("menu");
const modeButtons = document.querySelectorAll(".mode-btn");
const difficultyButtons = document.querySelectorAll(".difficulty-btn");
const startGameButton = document.getElementById("start-game");
const menuBackButton = document.getElementById("menu-back");

let found = new Set();
let seconds = DIFFICULTY_SETTINGS.normal.seconds;
let timerId;
let gameStarted = false;
let selectedMode = "fylker";
let selectedDifficulty = "normal";

function normalize(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function drawMap(features) {
  svg.innerHTML = "";

  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;

  function scan(coords) {
    if (typeof coords[0] === "number") {
      minX = Math.min(minX, coords[0]);
      maxX = Math.max(maxX, coords[0]);
      minY = Math.min(minY, coords[1]);
      maxY = Math.max(maxY, coords[1]);
      return;
    }

    coords.forEach(scan);
  }

  features.forEach(f => scan(f.geometry.coordinates));

  const width = 700;
  const isPC = window.innerWidth >= 700;
  const height = isPC ? 700 : 900;
  const padding = 18;

  const scale = Math.min(
    (width - padding * 2) / (maxX - minX),
    (height - padding * 2) / (maxY - minY)
  );

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  function project(p) {
    return [
      (p[0] - minX) * scale + padding,
      height - ((p[1] - minY) * scale + padding)
    ];
  }

  function ring(points) {
    return points.map((p, i) => {
      const q = project(p);
      return (i ? "L" : "M") + q[0].toFixed(2) + " " + q[1].toFixed(2);
    }).join(" ") + " Z";
  }

  features.forEach(f => {
    const g = f.geometry;
    let d = "";

    if (g.type === "Polygon") {
      d = g.coordinates.map(ring).join(" ");
    }

    if (g.type === "MultiPolygon") {
      d = g.coordinates
        .map(poly => poly.map(ring).join(" "))
        .join(" ");
    }

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.classList.add("county");

    const propertiesText = normalize(JSON.stringify(f.properties || {}));
    path.dataset.properties = propertiesText;

    svg.appendChild(path);
  });
}

async function loadMap() {
  const response = await fetch(
    "https://raw.githubusercontent.com/robhop/fylker-og-kommuner/main/Fylker-M.geojson"
  );

  if (!response.ok) {
    throw new Error("Kartet kunne ikke lastes");
  }

  const data = await response.json();
  drawMap(data.features);
}

function updateTimer() {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;

  timer.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function showMenu() {
  menu.classList.remove("hidden");
  input.disabled = true;
  input.value = "";
  foundMessage.style.display = "none";
  status.textContent = "Velg en spillmodus for å starte.";
}

function hideMenu() {
  menu.classList.add("hidden");
}

function resetGame() {
  clearInterval(timerId);

  found = new Set();
  gameStarted = false;
  seconds = DIFFICULTY_SETTINGS[selectedDifficulty].seconds;

  score.querySelector("b").textContent = "0";
  input.value = "";
  foundMessage.style.display = "none";

  updateTimer();

  svg.querySelectorAll(".county").forEach(p => p.classList.remove("found"));
  input.disabled = false;
  status.textContent = "Skriv inn fylkene så raskt du kan.";
  input.focus();
}

function startGame({ preserveInput = false } = {}) {
  clearInterval(timerId);

  found = new Set();
  gameStarted = true;
  seconds = DIFFICULTY_SETTINGS[selectedDifficulty].seconds;

  score.querySelector("b").textContent = "0";
  if (!preserveInput) {
    input.value = "";
  }
  foundMessage.style.display = "none";

  updateTimer();

  svg.querySelectorAll(".county").forEach(p => p.classList.remove("found"));
  input.disabled = false;
  status.textContent = "Skriv inn fylkene så raskt du kan.";

  timerId = setInterval(() => {
    seconds--;
    updateTimer();

    if (seconds <= 0) {
      clearInterval(timerId);
      input.disabled = true;
      status.textContent = "⏰ Tiden er ute!";
      gameStarted = false;
    }
  }, 1000);

  input.focus();
}

function goToMenu() {
  clearInterval(timerId);
  gameStarted = false;
  seconds = DIFFICULTY_SETTINGS[selectedDifficulty].seconds;
  updateTimer();

  svg.querySelectorAll(".county").forEach(p => p.classList.remove("found"));
  found = new Set();
  score.querySelector("b").textContent = "0";
  input.value = "";
  input.disabled = true;
  foundMessage.style.display = "none";
  status.textContent = "Velg en spillmodus for å starte.";
  menu.classList.remove("hidden");
}

modeButtons.forEach(button => {
  button.addEventListener("click", () => {
    const chosenMode = button.dataset.mode;

    if (chosenMode !== "fylker") {
      status.textContent = "Denne spillmodusen kommer senere.";
      return;
    }

    selectedMode = chosenMode;
    modeButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.mode === chosenMode);
    });
  });
});

difficultyButtons.forEach(button => {
  button.addEventListener("click", () => {
    selectedDifficulty = button.dataset.difficulty;
    difficultyButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.difficulty === selectedDifficulty);
    });

    seconds = DIFFICULTY_SETTINGS[selectedDifficulty].seconds;
    updateTimer();

    if (!gameStarted) {
      status.textContent = `Vanskelighetsgrad: ${DIFFICULTY_SETTINGS[selectedDifficulty].label}`;
    }
  });
});

startGameButton.addEventListener("click", () => {
  hideMenu();
  startGame();
});

menuBackButton.addEventListener("click", goToMenu);

document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  if (!gameStarted) {
    const firstAnswer = input.value.trim();
    startGame({ preserveInput: true });
    input.value = firstAnswer;
  }

  const answer = normalize(input.value);
  input.value = "";

  const county = COUNTIES.find(x => normalize(x) === answer);

  if (!county) {
    status.textContent = "Ikke et fylkesnavn.";
    return;
  }

  if (found.has(county)) {
    status.textContent = "Allerede funnet.";
    return;
  }

  const answerName = normalize(county);

  const path = [...svg.querySelectorAll(".county")].find(p => {
    const properties = p.dataset.properties || "";
    return properties.includes(answerName);
  });

  if (!path) {
    status.textContent = "Fylket ble funnet, men kartområdet ble ikke funnet.";
    return;
  }

  found.add(county);
  path.classList.add("found");

  foundMessage.textContent = "✓ " + county;
  foundMessage.style.display = "block";

  score.querySelector("b").textContent = found.size;
  status.textContent = "✓ " + county;

  if (found.size === 15) {
    clearInterval(timerId);
    input.disabled = true;
    gameStarted = false;
    status.textContent = "🎉 Alle 15 fylkene!";
  }
});

document.getElementById("restart").addEventListener("click", resetGame);

loadMap().catch(() => {
  status.textContent = "Kartet kunne ikke lastes.";
});

showMenu();
updateTimer();
</script>

</body>
</html>
