<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NorgeKart</title>

<style>
:root {
  --bg-1: #07131f;
  --bg-2: #0d1d2d;
  --panel: rgba(13, 20, 27, 0.97);
  --panel-border: rgba(255,255,255,0.12);
  --text: #edf6ff;
  --muted: #aac2d8;
  --primary: #71d6ff;
  --primary-2: #4597ff;
  --success: #2ee59d;
  --success-dark: #0a8d5b;
  --shadow: rgba(4, 10, 18, 0.7);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  min-height: 100vh;
  width: 166.6667%;
  min-height: 166.6667vh;

  transform: scale(0.6);
  transform-origin: top left;

  background:
    radial-gradient(circle at top, rgba(76, 180, 255, 0.18), transparent 28%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));

  color: var(--text);
  font-family: Arial, sans-serif;
}

main {
  max-width: 920px;
  margin: 0 auto;
  padding: 18px 18px 24px;
}

h1 {
  margin: 0 0 10px 0;
  font-size: 26px;
  letter-spacing: 0.04em;
}

.map-container {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--panel-border);
  background: rgba(10, 17, 24, 0.9);
  box-shadow: 0 18px 36px var(--shadow);
}

.map-controls {
  position: absolute;
  top: 12px;
  left: 16px;
  right: 16px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

#timer {
  width: fit-content;
  padding: 8px 16px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 999px;
  background: linear-gradient(
    135deg,
    rgba(113,214,255,0.24),
    rgba(69,151,255,0.18)
  );
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.06em;
  box-shadow: 0 10px 22px rgba(28, 107, 158, 0.25);
}

#foundMessage {
  width: fit-content;
  margin: 0;
  padding: 7px 12px;
  background: linear-gradient(
    135deg,
    var(--success),
    var(--success-dark)
  );
  color: white;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  display: none;
  box-shadow: 0 10px 20px rgba(20, 117, 74, 0.3);
}

#map {
  width: 100%;
  display: block;
  margin: 0;
  background: linear-gradient(
    180deg,
    rgba(17, 25, 33, 0.95),
    rgba(11, 19, 27, 0.9)
  );
}

.county {
  fill: #2d4051;
  stroke: rgba(255,255,255,0.85);
  stroke-width: 1;
  transition: fill 0.2s ease, transform 0.2s ease;
}

.county.found {
  fill: #2ec27d;
  filter: drop-shadow(
    0 0 10px rgba(46, 194, 125, 0.6)
  );
}

.controls {
  display: flex;
  gap: 10px;
  margin: 14px 0 0 0;
}

input {
  flex: 1;
  padding: 14px 16px;
  font-size: 18px;
  background: rgba(14, 22, 28, 0.85);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 12px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.04);
}

input:focus {
  outline: 2px solid rgba(113, 214, 255, 0.45);
  border-color: rgba(113, 214, 255, 0.7);
}

button {
  padding: 14px 18px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(
    135deg,
    var(--primary),
    var(--primary-2)
  );
  color: #061418;
  font-weight: 800;
  box-shadow:
    0 12px 20px rgba(69, 151, 255, 0.25);
  cursor: pointer;
}

button:hover {
  filter: brightness(1.06);
}

#status {
  margin: 10px 0 0 0;
  color: var(--muted);
  font-size: 14px;
  min-height: 20px;
}

#score {
  margin: 12px 0 0 0;
  display: block;
  font-size: 16px;
  color: var(--text);
}

#restart {
  margin: 12px 0 0 0;
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: none;
}

/* MENY */

#menu {
  position: fixed;
  inset: 0;

  width: 166.6667vw;
  height: 166.6667vh;

  background: rgba(4, 9, 14, 0.98);
  backdrop-filter: blur(8px);

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 100;
  overflow: hidden;
}

#menu.hidden {
  display: none;
}

.menu-panel {
  width: min(560px, calc(100vw - 30px));
  padding: 26px 20px 20px;

  border-radius: 26px;

  background: linear-gradient(
    180deg,
    rgba(10,17,24,0.98),
    rgba(15,22,29,0.98)
  );

  border: 1px solid rgba(255,255,255,0.1);

  box-shadow:
    0 26px 55px rgba(0, 0, 0, 0.5);
}

.menu-title {
  margin: 0 0 18px 0;
  text-align: center;
  font-size: 28px;
  letter-spacing: 0.04em;
}

.section-title {
  margin: 18px 0 8px;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.mode-list,
.difficulty-list {
  display: grid;
  gap: 12px;
}

.mode-btn,
.difficulty-btn,
#start-game,
#menu-back {
  width: 100%;
  text-align: left;
  border-radius: 16px;

  background: rgba(255,255,255,0.04);
  color: var(--text);

  border: 1px solid rgba(255,255,255,0.08);

  box-shadow: none;

  font-size: 18px;
  font-weight: 700;

  padding: 18px 16px;
}

.mode-btn.active,
.difficulty-btn.active {
  background: linear-gradient(
    135deg,
    rgba(113,214,255,0.18),
    rgba(69,151,255,0.18)
  );

  border-color: rgba(113,214,255,0.55);

  box-shadow:
    0 12px 24px rgba(69, 151, 255, 0.15);
}

.mode-btn.coming-soon {
  opacity: 0.65;
  cursor: not-allowed;
}

.mode-btn .small,
.difficulty-btn .small {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 4px;
}

#start-game {
  margin-top: 18px;

  background: linear-gradient(
    135deg,
    var(--primary),
    var(--primary-2)
  );

  color: #061418;
  text-align: center;

  border: 0;

  box-shadow:
    0 12px 24px rgba(69, 151, 255, 0.2);
}

#menu-back {
  margin-top: 12px;
  text-align: center;
  background: rgba(255,255,255,0.02);
  border-color: rgba(255,255,255,0.1);
}

#menu-note {
  margin-top: 18px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* FYLKEVALG */

#countyPicker {
  position: fixed;
  inset: 0;

  width: 166.6667vw;
  height: 166.6667vh;

  z-index: 150;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(4, 9, 14, 0.98);
  backdrop-filter: blur(8px);
}

#countyPicker.hidden {
  display: none;
}

.county-picker-panel {
  width: min(560px, calc(100vw - 30px));
  max-height: 90vh;
  overflow-y: auto;

  padding: 26px 20px 20px;

  border-radius: 26px;

  background: linear-gradient(
    180deg,
    rgba(10,17,24,0.98),
    rgba(15,22,29,0.98)
  );

  border: 1px solid rgba(255,255,255,0.1);

  box-shadow:
    0 26px 55px rgba(0, 0, 0, 0.5);
}

.county-picker-title {
  margin: 0 0 8px;
  text-align: center;
  font-size: 28px;
}

.county-picker-subtitle {
  margin: 0 0 18px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

.county-choice-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.county-choice {
  width: 100%;
  text-align: center;
  padding: 15px 10px;
  border-radius: 14px;

  background: rgba(255,255,255,0.04);
  color: var(--text);

  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: none;

  font-size: 16px;
}

.county-choice:hover {
  background: linear-gradient(
    135deg,
    rgba(113,214,255,0.18),
    rgba(69,151,255,0.18)
  );

  border-color: rgba(113,214,255,0.55);
}

#county-picker-back {
  width: 100%;
  margin-top: 14px;

  background: rgba(255,255,255,0.05);
  color: var(--text);

  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: none;

  text-align: center;
}

/* RESULTATSBOKS */

#resultOverlay {
  position: fixed;
  inset: 0;

  width: 166.6667vw;
  height: 166.6667vh;

  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(4, 9, 14, 0.72);
  backdrop-filter: blur(6px);
}

#resultOverlay.hidden {
  display: none;
}

.result-panel {
  width: min(420px, 100%);
  padding: 30px 24px 24px;

  text-align: center;

  border-radius: 24px;

  background: linear-gradient(
    180deg,
    rgba(15, 25, 34, 0.99),
    rgba(9, 17, 24, 0.99)
  );

  border: 1px solid rgba(113, 214, 255, 0.25);

  box-shadow:
    0 25px 60px rgba(0, 0, 0, 0.6);
}

.result-emoji {
  font-size: 52px;
}

.result-panel h2 {
  margin: 8px 0;
  font-size: 30px;
}

.result-score {
  font-size: 32px;
  font-weight: 800;
  color: var(--success);
  margin: 12px 0;
}

.result-panel p {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: 17px;
}

#result-restart,
#result-menu {
  width: 100%;
  margin-top: 10px;
}

#result-menu {
  background: rgba(255,255,255,0.07);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: none;
}

@media (min-width: 700px) {
  #map {
    height: 900px;
    object-fit: contain;
    object-position: center top;
  }
}

@media (max-width: 699px) {
  main {
    padding: 12px 12px 20px;
  }

  #map {
    height: auto;
    width: 100%;
  }

  .controls {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .county-choice-list {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<main>

<script>

const COUNTIES = [
  "Agder",
  "Akershus",
  "Buskerud",
  "Finnmark",
  "Innlandet",
  "Møre og Romsdal",
  "Nordland",
  "Oslo",
  "Rogaland",
  "Telemark",
  "Troms",
  "Trøndelag",
  "Vestfold",
  "Vestland",
  "Østfold"
];


/* ---------------- FYLKESNUMMER ---------------- */

const COUNTY_CODES = {
  "03": "Oslo",
  "11": "Rogaland",
  "15": "Møre og Romsdal",
  "18": "Nordland",
  "31": "Østfold",
  "32": "Akershus",
  "33": "Buskerud",
  "34": "Innlandet",
  "39": "Vestfold",
  "40": "Telemark",
  "42": "Agder",
  "46": "Vestland",
  "50": "Trøndelag",
  "55": "Troms",
  "56": "Finnmark"
};


const DIFFICULTY_SETTINGS = {
  lett: {
    seconds: 180,
    label: "Lett"
  },
  normal: {
    seconds: 120,
    label: "Normal"
  },
  hard: {
    seconds: 60,
    label: "Hard"
  }
};

const svg =
  document.getElementById("map");

const input =
  document.getElementById("answer");

const score =
  document.getElementById("score");

const timer =
  document.getElementById("timer");

const status =
  document.getElementById("status");

const foundMessage =
  document.getElementById("foundMessage");

const menu =
  document.getElementById("menu");

const menuNote =
  document.getElementById("menu-note");

const modeButtons =
  document.querySelectorAll(".mode-btn");

const difficultyButtons =
  document.querySelectorAll(".difficulty-btn");

const startGameButton =
  document.getElementById("start-game");

const menuBackButton =
  document.getElementById("menu-back");

const resultOverlay =
  document.getElementById("resultOverlay");

const resultEmoji =
  document.getElementById("resultEmoji");

const resultTitle =
  document.getElementById("resultTitle");

const resultScore =
  document.getElementById("resultScore");

const resultText =
  document.getElementById("resultText");

const resultRestartButton =
  document.getElementById("result-restart");

const resultMenuButton =
  document.getElementById("result-menu");

const countyPicker =
  document.getElementById("countyPicker");

const countyChoiceList =
  document.getElementById("countyChoiceList");

const countyPickerBack =
  document.getElementById("county-picker-back");

const gameTitle =
  document.getElementById("gameTitle");

let found = new Set();

let seconds =
  DIFFICULTY_SETTINGS.normal.seconds;

let timerId;

let gameStarted = false;

let selectedMode = "fylker";

let selectedDifficulty = "normal";

let selectedCounty = "";

let currentFeatures = [];

let currentAnswerList = [];

let currentTotal = 15;

let currentMapType = "county";

let fylkeFeatures = [];

let kommuneFeatures = [];


/* ---------------- NORMALIZE ---------------- */

function normalize(text) {

  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();
}


/* ---------------- PROPERTY HELPERS ---------------- */

function getProperty(
  properties,
  possibleNames
) {

  const keys =
    Object.keys(properties || {});

  for (
    const wanted of possibleNames
  ) {

    const exact =
      keys.find(
        key =>
          normalize(key) ===
          normalize(wanted)
      );

    if (exact) {
      return properties[exact];
    }
  }

  return "";
}


/* ---------------- KODEHÅNDTERING ---------------- */

function cleanNumberCode(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/\D/g, "");
}


function getCountyCode(feature) {

  const properties =
    feature.properties || {};

  const directCountyCode =
    getProperty(
      properties,
      [
        "fylkesnummer",
        "fylkesnr",
        "fylke_nr",
        "fylkeid",
        "fylke_id",
        "county_code",
        "countycode"
      ]
    );

  let code =
    cleanNumberCode(
      directCountyCode
    );

  if (code) {

    if (code.length === 1) {
      code = "0" + code;
    }

    return code.slice(0, 2);
  }


  const municipalityNumber =
    getProperty(
      properties,
      [
        "kommunenummer",
        "kommunenr",
        "kommune_nr",
        "kommuneid",
        "kommune_id",
        "kommunenummer_",
        "KOMMUNENUMMER",
        "KOMMUNENR"
      ]
    );

  code =
    cleanNumberCode(
      municipalityNumber
    );

  if (
    code.length >= 4
  ) {

    return code.slice(0, 2);
  }

  return "";
}


/* ---------------- FYLKE FRA KOMMUNE ---------------- */

function getMunicipalityCountyName(
  feature
) {

  const properties =
    feature.properties || {};

  const directName =
    getProperty(
      properties,
      [
        "fylkesnavn",
        "fylkenavn",
        "fylkesnavn_",
        "Fylkesnavn",
        "FYLKESNAVN",
        "navn_fylke",
        "county_name",
        "countyname"
      ]
    );

  if (
    directName !== null &&
    directName !== undefined &&
    String(directName).trim() !== ""
  ) {

    const text =
      String(directName).trim();

    if (
      /[a-zA-ZæøåÆØÅ]/.test(text)
    ) {
      return text;
    }
  }


  const fylkeValue =
    getProperty(
      properties,
      [
        "fylke",
        "Fylke",
        "FYLKE",
        "fylke_nr",
        "fylkesnr",
        "fylkesnummer"
      ]
    );

  const fylkeText =
    String(
      fylkeValue || ""
    ).trim();

  if (
    /[a-zA-ZæøåÆØÅ]/.test(
      fylkeText
    )
  ) {

    return fylkeText;
  }


  const code =
    getCountyCode(feature);

  return COUNTY_CODES[code] || "";
}


/* ---------------- KOMMUNENAVN ---------------- */

function getMunicipalityName(
  feature
) {

  const properties =
    feature.properties || {};

  return String(
    getProperty(
      properties,
      [
        "kommunenavn",
        "kommunenavn_",
        "Kommunenavn",
        "KOMMUNENAVN",
        "kommune",
        "Kommune",
        "navn",
        "Navn",
        "NAME",
        "name",
        "NAME_2"
      ]
    ) || ""
  ).trim();
}


/* ---------------- FYLKESNAVN ---------------- */

function getCountyName(
  feature
) {

  const properties =
    feature.properties || {};

  const value =
    getProperty(
      properties,
      [
        "fylkesnavn",
        "fylkenavn",
        "fylkesnavn_",
        "Fylkesnavn",
        "FYLKESNAVN",
        "fylke",
        "Fylke",
        "FYLKE",
        "county",
        "County",
        "county_name",
        "countyname",
        "navn_fylke",
        "navn",
        "Navn",
        "NAME",
        "name"
      ]
    );

  return String(
    value || ""
  ).trim();
}


/* ---------------- TILHØRER FYLKE ---------------- */

function municipalityBelongsToCounty(
  feature,
  countyName
) {

  const wanted =
    normalize(countyName);

  const direct =
    normalize(
      getMunicipalityCountyName(
        feature
      )
    );

  if (
    direct &&
    direct === wanted
  ) {

    return true;
  }


  const code =
    getCountyCode(feature);

  const codeCounty =
    COUNTY_CODES[code];

  if (
    codeCounty &&
    normalize(codeCounty) ===
      wanted
  ) {

    return true;
  }

  return false;
}


/* ---------------- MAP DRAWING ---------------- */

function drawMap(features) {

  svg.innerHTML = "";

  if (!features.length) {
    return;
  }

  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;

  function scan(coords) {

    if (
      typeof coords[0] === "number"
    ) {

      minX = Math.min(
        minX,
        coords[0]
      );

      maxX = Math.max(
        maxX,
        coords[0]
      );

      minY = Math.min(
        minY,
        coords[1]
      );

      maxY = Math.max(
        maxY,
        coords[1]
      );

      return;
    }

    coords.forEach(scan);
  }

  features.forEach(f => {

    if (
      f.geometry &&
      f.geometry.coordinates
    ) {

      scan(
        f.geometry.coordinates
      );
    }

  });

  const width = 700;

  const isPC =
    window.innerWidth >= 700;

  const height =
    isPC ? 700 : 900;

  const padding = 18;

  const dataWidth =
    maxX - minX;

  const dataHeight =
    maxY - minY;

  const scale = Math.min(
    (width - padding * 2) /
      dataWidth,

    (height - padding * 2) /
      dataHeight
  );

  svg.setAttribute(
    "viewBox",
    `0 0 ${width} ${height}`
  );

  function project(p) {

    return [
      (p[0] - minX) *
        scale +
        padding,

      height -
        (
          (p[1] - minY) *
            scale +
          padding
        )
    ];
  }

  function ring(points) {

    return points
      .map((p, i) => {

        const q =
          project(p);

        return (
          i ? "L" : "M"
        ) +
          q[0].toFixed(2) +
          " " +
          q[1].toFixed(2);

      })
      .join(" ") + " Z";
  }

  features.forEach(f => {

    const g =
      f.geometry;

    if (!g) {
      return;
    }

    let d = "";

    if (
      g.type === "Polygon"
    ) {

      d =
        g.coordinates
          .map(ring)
          .join(" ");

    }

    if (
      g.type === "MultiPolygon"
    ) {

      d =
        g.coordinates
          .map(poly =>
            poly
              .map(ring)
              .join(" ")
          )
          .join(" ");

    }

    const path =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    path.setAttribute(
      "d",
      d
    );

    path.classList.add(
      "county"
    );

    path.dataset.name =
      currentMapType === "county"
        ? getCountyName(f)
        : getMunicipalityName(f);

    svg.appendChild(path);

  });
}


/* ---------------- LOAD MAPS ---------------- */

async function loadMaps() {

  const [
    fylkeResponse,
    kommuneResponse
  ] = await Promise.all([

    fetch(
      "https://raw.githubusercontent.com/robhop/fylker-og-kommuner/main/Fylker-M.geojson"
    ),

    fetch(
      "https://raw.githubusercontent.com/robhop/fylker-og-kommuner/main/Kommuner-M.geojson"
    )

  ]);

  if (
    !fylkeResponse.ok ||
    !kommuneResponse.ok
  ) {

    throw new Error(
      "Kartene kunne ikke lastes"
    );
  }

  const fylkeData =
    await fylkeResponse.json();

  const kommuneData =
    await kommuneResponse.json();

  fylkeFeatures =
    fylkeData.features || [];

  kommuneFeatures =
    kommuneData.features || [];

  currentFeatures =
    fylkeFeatures;

  currentAnswerList =
    COUNTIES;

  currentTotal =
    COUNTIES.length;

  currentMapType =
    "county";

  drawMap(
    currentFeatures
  );

  console.log(
    "Fylker lastet:",
    fylkeFeatures.length
  );

  console.log(
    "Kommuner lastet:",
    kommuneFeatures.length
  );

  console.log(
    "Eksempel kommune:",
    kommuneFeatures[0]?.properties
  );
}


/* ---------------- TIMER ---------------- */

function updateTimer() {

  const m =
    Math.floor(seconds / 60);

  const s =
    seconds % 60;

  timer.textContent =
    String(m).padStart(2, "0") +
    ":" +
    String(s).padStart(2, "0");
}


/* ---------------- RESULTAT ---------------- */

function showResultScreen(
  type,
  count
) {

  resultOverlay.classList.remove(
    "hidden"
  );

  resultScore.textContent =
    count +
    " / " +
    currentTotal;

  if (type === "win") {

    resultEmoji.textContent =
      "🎉";

    resultTitle.textContent =
      "Gratulerer!";

    resultText.textContent =
      currentMapType === "county"
        ? "Du fant alle fylkene! 😉"
        : "Du fant alle kommunene! 😉";
  }

  if (type === "almost") {

    resultEmoji.textContent =
      "🔥";

    resultTitle.textContent =
      "Bra jobbet!";

    resultText.textContent =
      "Nesten 😉";
  }

  if (type === "far") {

    resultEmoji.textContent =
      "😅";

    resultTitle.textContent =
      "Godt forsøk!";

    resultText.textContent =
      "Langt i fra 😉";
  }
}


function hideResultScreen() {

  resultOverlay.classList.add(
    "hidden"
  );
}


/* ---------------- MENY ---------------- */

function updateMenuNote() {

  if (
    selectedMode === "kommuner-fylke" &&
    selectedCounty
  ) {

    menuNote.textContent =
      "Valgt fylke: " +
      selectedCounty +
      ". Trykk Start for å begynne.";

  } else if (
    selectedMode === "kommuner-fylke"
  ) {

    menuNote.textContent =
      "Velg et fylke før du trykker Start.";

  } else {

    menuNote.textContent =
      "Velg en spillmodus for å starte.";
  }
}


function showMenu() {

  hideResultScreen();

  countyPicker.classList.add(
    "hidden"
  );

  menu.classList.remove(
    "hidden"
  );

  input.disabled = true;

  input.value = "";

  foundMessage.style.display =
    "none";

  updateMenuNote();
}


function hideMenu() {

  menu.classList.add(
    "hidden"
  );
}


/* ---------------- RESET ---------------- */

function resetGame() {

  clearInterval(timerId);

  hideResultScreen();

  found =
    new Set();

  gameStarted = false;

  seconds =
    DIFFICULTY_SETTINGS[
      selectedDifficulty
    ].seconds;

  score.querySelector(
    "b"
  ).textContent = "0";

  input.value = "";

  foundMessage.style.display =
    "none";

  updateTimer();

  svg.querySelectorAll(
    ".county"
  ).forEach(p =>
    p.classList.remove(
      "found"
    )
  );

  input.disabled = false;

  status.textContent =
    currentMapType === "county"
      ? "Skriv inn fylkene så raskt du kan."
      : "Skriv inn kommunene så raskt du kan.";

  input.focus();

  gameStarted = true;

  timerId =
    setInterval(() => {

      seconds--;

      updateTimer();

      if (seconds <= 0) {

        clearInterval(
          timerId
        );

        input.disabled =
          true;

        gameStarted =
          false;

        status.textContent =
          "⏰ Tiden er ute!";

        if (
          found.size >=
          Math.ceil(
            currentTotal * 0.53
          )
        ) {

          showResultScreen(
            "almost",
            found.size
          );

        } else {

          showResultScreen(
            "far",
            found.size
          );
        }
      }

    }, 1000);
}


/* ---------------- START GAME ---------------- */

function startGame(
  { preserveInput = false } = {}
) {

  clearInterval(timerId);

  hideResultScreen();

  found =
    new Set();

  gameStarted = true;

  seconds =
    DIFFICULTY_SETTINGS[
      selectedDifficulty
    ].seconds;

  score.querySelector(
    "b"
  ).textContent = "0";

  if (!preserveInput) {
    input.value = "";
  }

  foundMessage.style.display =
    "none";

  updateTimer();

  svg.querySelectorAll(
    ".county"
  ).forEach(p =>
    p.classList.remove(
      "found"
    )
  );

  input.disabled = false;

  status.textContent =
    currentMapType === "county"
      ? "Skriv inn fylkene så raskt du kan."
      : "Skriv inn kommunene så raskt du kan.";

  timerId =
    setInterval(() => {

      seconds--;

      updateTimer();

      if (seconds <= 0) {

        clearInterval(
          timerId
        );

        input.disabled =
          true;

        gameStarted =
          false;

        status.textContent =
          "⏰ Tiden er ute!";

        if (
          found.size >=
          Math.ceil(
            currentTotal * 0.53
          )
        ) {

          showResultScreen(
            "almost",
            found.size
          );

        } else {

          showResultScreen(
            "far",
            found.size
          );
        }
      }

    }, 1000);

  input.focus();
}


/* ---------------- PREPARE COUNTY GAME ---------------- */

function prepareSelectedCountyGame() {

  if (!selectedCounty) {
    return false;
  }

  const matchingFeatures =
    kommuneFeatures.filter(
      feature =>
        municipalityBelongsToCounty(
          feature,
          selectedCounty
        )
    );

  if (
    matchingFeatures.length === 0
  ) {

    status.textContent =
      "Fant ingen kommuner i " +
      selectedCounty +
      ".";

    return false;
  }

  currentFeatures =
    matchingFeatures;

  currentAnswerList =
    matchingFeatures
      .map(
        getMunicipalityName
      )
      .filter(Boolean);

  if (
    currentAnswerList.length === 0
  ) {

    status.textContent =
      "Fant kommunene, men kommunenavn mangler.";

    return false;
  }

  currentTotal =
    currentAnswerList.length;

  currentMapType =
    "municipality";

  gameTitle.textContent =
    "🇳🇴 " +
    selectedCounty;

  input.placeholder =
    "Skriv en kommune...";

  score.innerHTML =
    "<b>0</b> / " +
    currentTotal +
    " kommuner";

  drawMap(
    currentFeatures
  );

  return true;
}


/* ---------------- START SELECTED COUNTY GAME ---------------- */

function startSelectedCountyGame() {

  const prepared =
    prepareSelectedCountyGame();

  if (!prepared) {
    return false;
  }

  hideMenu();

  startGame();

  return true;
}


/* ---------------- COUNTY PICKER ---------------- */

function openCountyPicker() {

  clearInterval(timerId);

  gameStarted = false;

  hideResultScreen();

  menu.classList.add(
    "hidden"
  );

  countyPicker.classList.remove(
    "hidden"
  );

  countyChoiceList.innerHTML =
    "";

  COUNTIES.forEach(county => {

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "county-choice";

    button.textContent =
      county;

    button.addEventListener(
      "click",
      () => {

        chooseCounty(
          county
        );

      }
    );

    countyChoiceList.appendChild(
      button
    );

  });
}


/* ---------------- CHOOSE COUNTY ---------------- */

function chooseCounty(county) {

  const matchingFeatures =
    kommuneFeatures.filter(
      feature =>
        municipalityBelongsToCounty(
          feature,
          county
        )
    );

  if (
    matchingFeatures.length === 0
  ) {

    status.textContent =
      "Fant ingen kommuner i " +
      county +
      ".";

    return;
  }

  selectedCounty =
    county;

  countyPicker.classList.add(
    "hidden"
  );

  menu.classList.remove(
    "hidden"
  );

  input.disabled = true;

  currentFeatures =
    fylkeFeatures;

  currentAnswerList =
    COUNTIES;

  currentTotal =
    COUNTIES.length;

  currentMapType =
    "county";

  gameTitle.textContent =
    "🇳🇴 Fylkene";

  input.placeholder =
    "Skriv et fylke...";

  score.innerHTML =
    "<b>0</b> / 15 fylker";

  drawMap(
    currentFeatures
  );

  updateMenuNote();

  status.textContent =
    "Fylke valgt: " +
    selectedCounty +
    ". Trykk Start.";
}


/* ---------------- RETURN TO MENU ---------------- */

function goToMenu() {

  clearInterval(timerId);

  hideResultScreen();

  countyPicker.classList.add(
    "hidden"
  );

  gameStarted =
    false;

  currentFeatures =
    fylkeFeatures;

  currentAnswerList =
    COUNTIES;

  currentTotal =
    COUNTIES.length;

  currentMapType =
    "county";

  gameTitle.textContent =
    "🇳🇴 Fylkene";

  input.placeholder =
    "Skriv et fylke...";

  seconds =
    DIFFICULTY_SETTINGS[
      selectedDifficulty
    ].seconds;

  updateTimer();

  drawMap(
    currentFeatures
  );

  found =
    new Set();

  score.innerHTML =
    "<b>0</b> / 15 fylker";

  input.value = "";

  input.disabled =
    true;

  foundMessage.style.display =
    "none";

  updateMenuNote();

  status.textContent =
    selectedCounty &&
    selectedMode === "kommuner-fylke"
      ? "Valgt fylke: " +
        selectedCounty +
        ". Trykk Start."
      : "Velg en spillmodus for å starte.";

  menu.classList.remove(
    "hidden"
  );
}


/* ---------------- MODE BUTTONS ---------------- */

modeButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const chosenMode =
        button.dataset.mode;


      /*
        VIKTIG ENDRING:

        Hver gang man trykker
        "Kommuner i et fylke",
        åpnes fylkevelgeren.

        Dermed kan man velge
        et nytt fylke etterpå.
      */

      if (
        chosenMode ===
        "kommuner-fylke"
      ) {

        selectedMode =
          chosenMode;

        modeButtons.forEach(
          btn =>
            btn.classList.toggle(
              "active",
              btn.dataset.mode ===
                chosenMode
            )
        );

        openCountyPicker();

        return;
      }


      if (
        chosenMode !==
        "fylker"
      ) {

        status.textContent =
          "Denne spillmodusen kommer senere.";

        return;
      }

      selectedMode =
        chosenMode;

      modeButtons.forEach(
        btn =>
          btn.classList.toggle(
            "active",
            btn.dataset.mode ===
              chosenMode
          )
      );

      updateMenuNote();

    }
  );

});


/* ---------------- DIFFICULTY ---------------- */

difficultyButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      selectedDifficulty =
        button.dataset.difficulty;

      difficultyButtons.forEach(
        btn =>
          btn.classList.toggle(
            "active",
            btn.dataset.difficulty ===
              selectedDifficulty
          )
      );

      seconds =
        DIFFICULTY_SETTINGS[
          selectedDifficulty
        ].seconds;

      updateTimer();

      if (!gameStarted) {

        status.textContent =
          `Vanskelighetsgrad: ${
            DIFFICULTY_SETTINGS[
              selectedDifficulty
            ].label
          }`;

        updateMenuNote();
      }

    }
  );

});


/* ---------------- START BUTTON ---------------- */

startGameButton.addEventListener(
  "click",
  () => {

    if (
      selectedMode ===
      "kommuner-fylke"
    ) {

      if (selectedCounty) {

        const started =
          startSelectedCountyGame();

        if (started) {
          return;
        }

        openCountyPicker();

        return;
      }

      openCountyPicker();

      return;
    }


    hideMenu();

    currentFeatures =
      fylkeFeatures;

    currentAnswerList =
      COUNTIES;

    currentTotal =
      COUNTIES.length;

    currentMapType =
      "county";

    gameTitle.textContent =
      "🇳🇴 Fylkene";

    input.placeholder =
      "Skriv et fylke...";

    score.innerHTML =
      "<b>0</b> / 15 fylker";

    drawMap(
      currentFeatures
    );

    startGame();

  }
);


/* ---------------- BACK FROM COUNTY PICKER ---------------- */

countyPickerBack.addEventListener(
  "click",
  () => {

    countyPicker.classList.add(
      "hidden"
    );

    menu.classList.remove(
      "hidden"
    );

    updateMenuNote();

  }
);


/* ---------------- MENU BACK BUTTON ---------------- */

menuBackButton.addEventListener(
  "click",
  goToMenu
);


/* ---------------- RESULT RESTART ---------------- */

resultRestartButton.addEventListener(
  "click",
  () => {

    hideResultScreen();

    if (
      selectedMode ===
      "kommuner-fylke" &&
      selectedCounty
    ) {

      startSelectedCountyGame();

      return;
    }

    startGame();

  }
);


/* ---------------- RESULT MENU ---------------- */

resultMenuButton.addEventListener(
  "click",
  () => {

    hideResultScreen();

    goToMenu();

  }
);


/* ---------------- ANSWER FORM ---------------- */

document
  .getElementById("form")
  .addEventListener(
    "submit",
    function(e) {

      e.preventDefault();

      if (!gameStarted) {

        const firstAnswer =
          input.value.trim();

        startGame({
          preserveInput: true
        });

        input.value =
          firstAnswer;
      }

      const answer =
        normalize(
          input.value
        );

      input.value =
        "";

      const matchingName =
        currentAnswerList.find(
          name =>
            normalize(name) ===
            answer
        );

      if (!matchingName) {

        status.textContent =
          currentMapType === "county"
            ? "Ikke et fylkesnavn."
            : "Ikke et kommunenavn.";

        return;
      }

      if (
        found.has(
          matchingName
        )
      ) {

        status.textContent =
          "Allerede funnet.";

        return;
      }

      const path =
        [
          ...svg.querySelectorAll(
            ".county"
          )
        ].find(p =>
          normalize(
            p.dataset.name || ""
          ) ===
          normalize(
            matchingName
          )
        );

      if (!path) {

        status.textContent =
          "Området ble funnet, men kartområdet ble ikke funnet.";

        return;
      }

      found.add(
        matchingName
      );

      path.classList.add(
        "found"
      );

      foundMessage.textContent =
        "✓ " +
        matchingName;

      foundMessage.style.display =
        "block";

      score.querySelector(
        "b"
      ).textContent =
        found.size;

      status.textContent =
        "✓ " +
        matchingName;

      if (
        found.size ===
        currentTotal
      ) {

        clearInterval(
          timerId
        );

        input.disabled =
          true;

        gameStarted =
          false;

        status.textContent =
          currentMapType === "county"
            ? "🎉 Alle 15 fylkene!"
            : "🎉 Alle kommunene!";

        showResultScreen(
          "win",
          found.size
        );
      }

    }
  );


/* ---------------- RESTART ---------------- */

document
  .getElementById("restart")
  .addEventListener(
    "click",
    () => {

      if (
        selectedMode ===
        "kommuner-fylke" &&
        selectedCounty
      ) {

        startSelectedCountyGame();

      } else {

        resetGame();

      }

    }
  );


/* ---------------- LOAD ---------------- */

loadMaps()
  .catch(error => {

    console.error(
      "Kartfeil:",
      error
    );

    status.textContent =
      "Kartet kunne ikke lastes.";

  });

showMenu();
updateTimer();

</script>
